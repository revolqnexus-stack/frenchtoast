<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e110c"/>
      <stop offset="55%" stop-color="#35251f"/>
      <stop offset="100%" stop-color="#7a4a28"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7f2e8"/>
      <stop offset="40%" stop-color="#f2d36b"/>
      <stop offset="60%" stop-color="#fffcf6"/>
      <stop offset="100%" stop-color="#f7f2e8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)" rx="16"/>
  <!-- Thin top rule -->
  <line x1="40" y1="48" x2="360" y2="48" stroke="rgba(242,211,107,0.25)" stroke-width="1"/>
  <!-- Wordmark -->
  <text x="200" y="240" font-family="'Playfair Display', Georgia, serif" font-size="68" font-style="italic" font-weight="400" fill="url(#shimmer)" text-anchor="middle" letter-spacing="-1">french</text>
  <text x="200" y="320" font-family="'Playfair Display', Georgia, serif" font-size="68" font-style="italic" font-weight="400" fill="url(#shimmer)" text-anchor="middle" letter-spacing="-1">toast</text>
  <!-- Thin bottom rule -->
  <line x1="40" y1="452" x2="360" y2="452" stroke="rgba(242,211,107,0.25)" stroke-width="1"/>
  <!-- Location -->
  <text x="200" y="478" font-family="'Manrope', system-ui, sans-serif" font-size="11" font-weight="500" fill="rgba(247,242,232,0.35)" text-anchor="middle" letter-spacing="3">PANAMPILLY NAGAR · KOCHI</text>
</svg>
