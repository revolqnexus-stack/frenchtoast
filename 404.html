<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — French Toast · Kochi</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600&display=swap" />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/nav.css" />
  <link rel="stylesheet" href="assets/css/components.css" />

  <style>
    .not-found {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--sp-16) var(--margin-h);
      background: var(--espresso);
      color: var(--warm-white);
    }
    .not-found-num {
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(6rem, 20vw, 14rem);
      font-weight: 400;
      line-height: 1;
      color: var(--butter);
      opacity: 0.18;
      letter-spacing: -0.04em;
      margin-bottom: var(--sp-4);
    }
    .not-found h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 1.2;
      margin-bottom: var(--sp-5);
    }
    .not-found h1 em { font-style: italic; color: var(--butter); }
    .not-found p {
      font-family: var(--font-body);
      font-size: var(--text-body-lg);
      font-weight: 300;
      color: rgba(255,252,246,0.5);
      max-width: 360px;
      line-height: 1.72;
      margin-bottom: var(--sp-10);
    }
    .not-found-actions {
      display: flex;
      gap: var(--sp-4);
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>

  <main class="not-found">
    <p class="not-found-num" aria-hidden="true">404</p>
    <h1>This page is<br><em>taking a break.</em></h1>
    <p>Looks like this page went out for breakfast and didn't come back. Head home and try again.</p>
    <div class="not-found-actions">
      <a href="/" class="btn btn--primary">Back to Home</a>
      <a href="/menu" class="btn btn--outline" style="border-color:rgba(247,242,232,0.3);color:var(--warm-white);">View the Menu</a>
    </div>
  </main>

</body>
</html>
